# COTURN CONFIG CHO AZURE TURN SERVER
# File: /etc/turnserver.conf

# Listening port
listening-port=3478
tls-listening-port=5349

# External IP của Azure VM
external-ip=20.197.12.68

# Realm (dùng IP hoặc domain của bạn)
realm=20.197.12.68

# Logging
verbose
log-file=/var/log/turnserver.log

# Authentication
lt-cred-mech
user=turnuser:turnpass123

# Relay IP (cùng với external IP)
relay-ip=20.197.12.68

# Relay ports range
min-port=49152
max-port=65535

# Fingerprint
fingerprint

# Security
no-multicast-peers
no-cli
no-loopback-peers
no-tlsv1
no-tlsv1_1

# Optional: SSL certificates (nếu có domain)
# cert=/etc/ssl/turn_server_cert.pem
# pkey=/etc/ssl/turn_server_pkey.pem
